name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    # macOS is the target platform for gitty; runners are free for public repos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
