version: 2
project_name: gitty

builds:
  - main: ./cmd/gitty
    binary: gitty
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X github.com/wiremeusd/gitty/internal/auth.builtinClientID={{ if index .Env "GITTY_CLIENT_ID" }}{{ .Env.GITTY_CLIENT_ID }}{{ end }}

release:
  footer: |
    ---
    **Website:** https://gitty.pro · **Install:** `brew install --cask wiremeusd/tap/gitty`

archives:
  - formats: [tar.gz]
    # no version in the name — keeps releases/latest/download/ URLs stable
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

# casks are macOS-only; Linux users install from the release tarball (see README)
homebrew_casks:
  - name: gitty
    directory: Casks
    repository:
      owner: wiremeusd
      name: homebrew-tap
      # the token field accepts only {{ .Env.VAR }} — conditional templates break publishing
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://gitty.pro
    description: "Interactive GitHub repo cloning from the terminal"
    license: MIT
    # release binaries are not signed/notarized — strip the quarantine flag on install
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/gitty"]
          end
